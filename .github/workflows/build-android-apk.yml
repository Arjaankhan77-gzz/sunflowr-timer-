

name: Build Sunflower Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            printf '%s\n' '{"appId":"com.sunflowerclock.app","appName":"Sunflower Clock","webDir":"dist"}' > capacitor.config.json
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunflower-Clock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
