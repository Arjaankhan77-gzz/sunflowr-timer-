

name: Build Sunflower Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 --legacy-peer-deps

      - name: Install native background alarm notifications
        run: npm install @capacitor/local-notifications@^7 --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            printf '%s\n' '{"appId":"com.sunflowerclock.app","appName":"Sunflower Clock","webDir":"dist"}' > capacitor.config.json
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Enable full-screen alarm on Android lock screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found after Capacitor sync")
          xml = manifest.read_text()
          for permission in [
              'android.permission.USE_FULL_SCREEN_INTENT',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.WAKE_LOCK',
          ]:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in xml:
                  xml = xml.replace('<application', f'    {tag}\n    <application', 1)
          marker = 'android:name=".MainActivity"'
          if marker in xml:
              start = xml.index(marker)
              end = xml.index('>', start)
              activity = xml[start:end]
              for attr in ['android:showWhenLocked="true"', 'android:turnScreenOn="true"']:
                  if attr not in activity:
                      xml = xml[:end] + ' ' + attr + xml[end:]
                      end = xml.index('>', start)
          elif 'android:showWhenLocked="true"' not in xml:
              raise SystemExit("MainActivity entry not found; refusing to silently skip lock-screen setup")
          manifest.write_text(xml)

          java = Path("node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java")
          if not java.exists():
              raise SystemExit("LocalNotificationManager.java not found; full-screen patch cannot be applied")
          source = java.read_text()
          anchor = 'mBuilder.setContentIntent(pendingIntent);'
          patched = anchor + '\n        mBuilder.setFullScreenIntent(pendingIntent, true);'
          if 'mBuilder.setFullScreenIntent(pendingIntent, true);' not in source:
              if anchor not in source:
                  raise SystemExit("Notification content intent anchor not found; refusing to silently skip full-screen patch")
              source = source.replace(anchor, patched, 1)
              java.write_text(source)
          print("Full-screen alarm intent and lock-screen activity flags configured.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunflower-Clock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
